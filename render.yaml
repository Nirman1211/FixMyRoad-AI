services:
  # ------------------------------------------------------------
  # FastAPI Backend Service
  # ------------------------------------------------------------
  - type: web
    name: fixmyroad-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fixmyroad-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: USE_LOCAL_YOLO
        value: "true"
      - key: CONFIDENCE_THRESHOLD
        value: "0.40"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ROBOFLOW_API_KEY
        sync: false

  # ------------------------------------------------------------
  # React 19 Frontend (Static Site with SPA Routing)
  # ------------------------------------------------------------
  - type: web
    name: fixmyroad-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ------------------------------------------------------------
# Managed PostgreSQL Database
# ------------------------------------------------------------
databases:
  - name: fixmyroad-db
    databaseName: fixmyroad
    user: fixmyroad_user
    region: oregon
    plan: free
